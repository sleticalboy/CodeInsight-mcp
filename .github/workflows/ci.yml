name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo test --locked

  semantic-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: semantic-smoke
      - run: scripts/semantic-smoke.sh

  release-install-smoke:
    name: release-install-smoke-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-install-smoke-${{ matrix.os }}
      - run: scripts/release-install-smoke.sh

  release-notes-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/extract-release-notes.sh CHANGELOG.md v0.1.2 /tmp/codeinsight-release-notes.md
      - run: |
          set -euo pipefail
          grep -q "Semantic smoke script" /tmp/codeinsight-release-notes.md
          ! grep -q "0.1.1" /tmp/codeinsight-release-notes.md
      - run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          printf darwin-arm >"$tmp/codeinsight-aarch64-apple-darwin.tar.gz"
          printf darwin-intel >"$tmp/codeinsight-x86_64-apple-darwin.tar.gz"
          printf linux-arm >"$tmp/codeinsight-aarch64-unknown-linux-gnu.tar.gz"
          printf linux-intel >"$tmp/codeinsight-x86_64-unknown-linux-gnu.tar.gz"
          scripts/update-homebrew-formula.sh v9.8.7 "$tmp" /tmp/codeinsight.rb
          ruby -c /tmp/codeinsight.rb
          grep -q 'releases/download/v9.8.7' /tmp/codeinsight.rb
          grep -q 'codeinsight-x86_64-unknown-linux-gnu.tar.gz' /tmp/codeinsight.rb
      - run: bash -n scripts/sync-homebrew-tap.sh
