name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo test --locked

  semantic-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: semantic-smoke
      - run: scripts/semantic-smoke.sh

  agent-router-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: agent-router-demo
      - run: scripts/agent-router-demo.sh

  agent-route-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: agent-route-smoke
      - run: scripts/agent-route-smoke.sh --summary-json /tmp/codeinsight-agent-route-smoke.json
      - id: agent-route-artifact
        uses: actions/upload-artifact@v7
        with:
          name: codeinsight-agent-route-smoke
          path: /tmp/codeinsight-agent-route-smoke.json
          if-no-files-found: error
      - run: scripts/agent-route-step-summary.sh /tmp/codeinsight-agent-route-smoke.json codeinsight-agent-route-smoke "${{ steps.agent-route-artifact.outputs.artifact-url }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - run: scripts/update-public-task-routing-matrix-smoke.sh
      - id: public-routing-snapshot-artifact
        uses: actions/upload-artifact@v7
        with:
          name: codeinsight-public-routing-snapshot
          path: |
            docs/public-task-routing-matrix.md
            docs/public-task-routing-matrix-summary.json
          if-no-files-found: error
      - run: scripts/public-task-routing-matrix-step-summary.sh docs/public-task-routing-matrix-summary.json codeinsight-public-routing-snapshot "${{ steps.public-routing-snapshot-artifact.outputs.artifact-url }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  mcp-first-call-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: mcp-first-call-smoke
      - run: |
          scripts/mcp-first-call-smoke.sh --summary-json /tmp/codeinsight-mcp-first-call.json
          cat /tmp/codeinsight-mcp-first-call.json
      - id: mcp-first-call-artifact
        uses: actions/upload-artifact@v7
        with:
          name: codeinsight-mcp-first-call
          path: /tmp/codeinsight-mcp-first-call.json
          if-no-files-found: error
      - run: scripts/mcp-first-call-step-summary.sh /tmp/codeinsight-mcp-first-call.json codeinsight-mcp-first-call "${{ steps.mcp-first-call-artifact.outputs.artifact-url }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  context-pack-quality-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: context-pack-quality-smoke
      - run: scripts/context-pack-quality-smoke.sh --summary-json /tmp/codeinsight-context-pack-quality.json
      - id: context-pack-quality-artifact
        uses: actions/upload-artifact@v7
        with:
          name: codeinsight-context-pack-quality
          path: /tmp/codeinsight-context-pack-quality.json
          if-no-files-found: error
      - run: scripts/context-pack-quality-step-summary.sh /tmp/codeinsight-context-pack-quality.json codeinsight-context-pack-quality "${{ steps.context-pack-quality-artifact.outputs.artifact-url }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  benchmark-subset-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: benchmark-subset-smoke
      - run: scripts/benchmark-smoke.sh
        env:
          CODEINSIGHT_BENCH_REPOS: p-limit
          CODEINSIGHT_BENCH_OUTPUT: /tmp/codeinsight-benchmark-subset.md
          CODEINSIGHT_BENCH_SUMMARY_JSON: /tmp/codeinsight-benchmark-subset.json
      - run: scripts/benchmark-report-smoke.sh /tmp/codeinsight-benchmark-subset.md smoke p-limit
      - id: benchmark-artifact
        uses: actions/upload-artifact@v7
        with:
          name: codeinsight-benchmark-subset
          path: |
            /tmp/codeinsight-benchmark-subset.md
            /tmp/codeinsight-benchmark-subset.json
          if-no-files-found: error
      - run: scripts/benchmark-step-summary.sh /tmp/codeinsight-benchmark-subset.md codeinsight-benchmark-subset "${{ steps.benchmark-artifact.outputs.artifact-url }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" /tmp/codeinsight-benchmark-subset.json

  release-install-smoke:
    name: release-install-smoke-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-install-smoke-${{ matrix.os }}
      - run: scripts/release-install-smoke.sh

  maintenance-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/release-notes-smoke.sh
      - run: scripts/script-syntax-smoke.sh
      - run: scripts/benchmark-reuse-checkout-smoke.sh
      - run: scripts/workflow-actions-smoke.sh
      - run: scripts/mcp-first-call-failure-smoke.sh
      - run: scripts/release-tooling-smoke.sh
      - run: scripts/docs-smoke.sh
