name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo test --locked

  semantic-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: semantic-smoke
      - run: scripts/semantic-smoke.sh

  release-install-smoke:
    name: release-install-smoke-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-install-smoke-${{ matrix.os }}
      - run: scripts/release-install-smoke.sh

  release-notes-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          set -euo pipefail
          latest_version="$(scripts/latest-changelog-version.sh CHANGELOG.md)"
          test -n "$latest_version"
          scripts/extract-release-notes.sh CHANGELOG.md latest /tmp/codeinsight-release-notes.md
          scripts/extract-release-notes.sh CHANGELOG.md "$latest_version" /tmp/codeinsight-release-notes-explicit.md
          scripts/extract-release-notes.sh --summary --max-items 2 CHANGELOG.md "$latest_version" /tmp/codeinsight-release-notes-summary.md
          cmp /tmp/codeinsight-release-notes.md /tmp/codeinsight-release-notes-explicit.md
          ! grep -Eq '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' /tmp/codeinsight-release-notes.md
          ! grep -Eq '^## \[Unreleased\]' /tmp/codeinsight-release-notes.md
          grep -q '^### Highlights' /tmp/codeinsight-release-notes-summary.md
          grep -q 'This release has ' /tmp/codeinsight-release-notes-summary.md
          test "$(grep -c '^- ' /tmp/codeinsight-release-notes-summary.md)" -le 2
      - run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          printf darwin-arm >"$tmp/codeinsight-aarch64-apple-darwin.tar.gz"
          printf darwin-intel >"$tmp/codeinsight-x86_64-apple-darwin.tar.gz"
          printf linux-arm >"$tmp/codeinsight-aarch64-unknown-linux-gnu.tar.gz"
          printf linux-intel >"$tmp/codeinsight-x86_64-unknown-linux-gnu.tar.gz"
          scripts/update-homebrew-formula.sh v9.8.7 "$tmp" /tmp/codeinsight.rb
          ruby -c /tmp/codeinsight.rb
          grep -q 'releases/download/v9.8.7' /tmp/codeinsight.rb
          grep -q 'codeinsight-x86_64-unknown-linux-gnu.tar.gz' /tmp/codeinsight.rb
      - run: bash -n scripts/sync-homebrew-tap.sh
      - run: bash -n scripts/prepare-release.sh
      - run: bash -n scripts/verify-release.sh
      - run: scripts/verify-release.sh --help >/tmp/codeinsight-verify-release-help.txt
      - run: |
          set -euo pipefail
          grep -q 'usage: scripts/verify-release.sh <tag-or-version>' /tmp/codeinsight-verify-release-help.txt
          grep -q 'Homebrew tap update is still waiting in an open PR' /tmp/codeinsight-verify-release-help.txt
      - run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cat >"$tmp/Cargo.toml" <<'EOF'
          [package]
          name = "codeinsight"
          version = "1.2.3"
          EOF
          touch "$tmp/Cargo.lock"
          cat >"$tmp/README.md" <<'EOF'
          # Test README
          EOF
          mkdir -p "$tmp/docs"
          cat >"$tmp/docs/install.md" <<'EOF'
          CODEINSIGHT_VERSION=v1.2.3 sh scripts/install.sh
          EOF
          cat >"$tmp/CHANGELOG.md" <<'EOF'
          # Changelog

          ## [Unreleased]

          ### Added

          - Test release automation.

          ## [1.2.3] - 2026-01-01

          ### Added

          - Previous release.
          EOF
          CODEINSIGHT_ROOT_DIR="$tmp" CODEINSIGHT_RELEASE_DATE=2026-07-08 CODEINSIGHT_SKIP_CARGO_CHECK=1 scripts/prepare-release.sh --dry-run v9.8.7 >"$tmp/dry-run.out"
          grep -q '^diff --git' "$tmp/dry-run.out"
          grep -q 'version = "9.8.7"' "$tmp/dry-run.out"
          grep -q '## \\[9.8.7\\] - 2026-07-08' "$tmp/dry-run.out"
          grep -q 'version = "1.2.3"' "$tmp/Cargo.toml"
          CODEINSIGHT_ROOT_DIR="$tmp" CODEINSIGHT_RELEASE_DATE=2026-07-08 CODEINSIGHT_SKIP_CARGO_CHECK=1 scripts/prepare-release.sh v9.8.7
          grep -q 'version = "9.8.7"' "$tmp/Cargo.toml"
          grep -q 'CODEINSIGHT_VERSION=v9.8.7' "$tmp/docs/install.md"
          grep -q '## \[9.8.7\] - 2026-07-08' "$tmp/CHANGELOG.md"
          scripts/extract-release-notes.sh "$tmp/CHANGELOG.md" latest "$tmp/notes.md"
          grep -q 'Test release automation' "$tmp/notes.md"
          scripts/extract-release-notes.sh --summary --max-items 1 "$tmp/CHANGELOG.md" latest "$tmp/summary-notes.md"
          grep -q 'Test release automation' "$tmp/summary-notes.md"
          ! grep -q 'This release has ' "$tmp/summary-notes.md"
          if CODEINSIGHT_ROOT_DIR="$tmp" CODEINSIGHT_SKIP_CARGO_CHECK=1 scripts/prepare-release.sh v9.8.7 >"$tmp/repeat.out" 2>&1; then
            echo "repeat release unexpectedly succeeded" >&2
            exit 1
          fi
          grep -q 'Cargo.toml is already at version 9.8.7' "$tmp/repeat.out"
          if CODEINSIGHT_ROOT_DIR="$tmp" CODEINSIGHT_SKIP_CARGO_CHECK=1 scripts/prepare-release.sh v9.8.6 >"$tmp/low.out" 2>&1; then
            echo "lower release unexpectedly succeeded" >&2
            exit 1
          fi
          grep -q 'must be greater than current Cargo.toml version 9.8.7' "$tmp/low.out"
          empty="$(mktemp -d)"
          cat >"$empty/Cargo.toml" <<'EOF'
          [package]
          name = "codeinsight"
          version = "1.2.3"
          EOF
          touch "$empty/Cargo.lock"
          printf '# Test README\n' >"$empty/README.md"
          mkdir -p "$empty/docs"
          printf 'CODEINSIGHT_VERSION=v1.2.3 sh scripts/install.sh\n' >"$empty/docs/install.md"
          cat >"$empty/CHANGELOG.md" <<'EOF'
          # Changelog

          ## [Unreleased]

          ## [1.2.3] - 2026-01-01

          ### Added

          - Previous release.
          EOF
          if CODEINSIGHT_ROOT_DIR="$empty" CODEINSIGHT_SKIP_CARGO_CHECK=1 scripts/prepare-release.sh v1.2.4 >"$empty/empty.out" 2>&1; then
            echo "empty changelog release unexpectedly succeeded" >&2
            exit 1
          fi
          grep -q 'CHANGELOG Unreleased section is empty' "$empty/empty.out"
          grep -q 'version = "1.2.3"' "$empty/Cargo.toml"
          grep -q 'CODEINSIGHT_VERSION=v1.2.3' "$empty/docs/install.md"
          CODEINSIGHT_ROOT_DIR="$empty" CODEINSIGHT_ALLOW_EMPTY_CHANGELOG=1 CODEINSIGHT_SKIP_CARGO_CHECK=1 scripts/prepare-release.sh v1.2.4
          grep -q 'version = "1.2.4"' "$empty/Cargo.toml"
          grep -q '## \[1.2.4\] - ' "$empty/CHANGELOG.md"
