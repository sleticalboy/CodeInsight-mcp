name: Release Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to sync Homebrew tap, for example v0.1.2. Leave empty to run a manual build only."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: build-${{ matrix.target }}
    if: github.event_name != 'workflow_dispatch' || inputs.tag == ''
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Configure Linux cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="codeinsight-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/codeinsight" "dist/${name}/"
          cp README.md LICENSE* "dist/${name}/" 2>/dev/null || true
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"

      - name: Smoke release install
        shell: bash
        env:
          CODEINSIGHT_TARGET: ${{ matrix.target }}
          CODEINSIGHT_SMOKE_ASSET: dist/codeinsight-${{ matrix.target }}.tar.gz
        run: scripts/release-install-smoke.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: codeinsight-${{ matrix.target }}
          path: dist/codeinsight-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: publish-github-release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: codeinsight-*
          path: release-assets
          merge-multiple: true

      - name: Prepare release notes
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: scripts/extract-release-notes.sh CHANGELOG.md "${TAG_NAME}" release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -lah release-assets
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" release-assets/*.tar.gz --clobber
            gh release edit "${TAG_NAME}" --notes-file release-notes.md
          else
            gh release create "${TAG_NAME}" release-assets/*.tar.gz \
              --title "${TAG_NAME}" \
              --notes-file release-notes.md
          fi

      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: scripts/sync-homebrew-tap.sh "${TAG_NAME}" release-assets

  homebrew-tap-sync:
    name: sync-homebrew-tap
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Validate tag input
        env:
          TAG_NAME: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "${TAG_NAME}" in
            v*) ;;
            *)
              echo "tag input must start with v, for example v0.1.2" >&2
              exit 1
              ;;
          esac

      - name: Download existing release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "${TAG_NAME}" --pattern 'codeinsight-*.tar.gz' --dir release-assets
          ls -lah release-assets

      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG_NAME: ${{ inputs.tag }}
        run: scripts/sync-homebrew-tap.sh "${TAG_NAME}" release-assets
